# Serves the built app and passes the API through, so the browser sees one
# origin, as it does with the Vite dev server.
server {
  listen 80;
  root /usr/share/nginx/html;

  location ~ ^/(api|sdk|openapi\.json|docs) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The SDK stream is server-sent events.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
